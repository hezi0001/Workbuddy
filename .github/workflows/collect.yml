name: 原油收盘价每日自动收集

on:
  schedule:
    # 北京时间 06:30（UTC+8）= 前一日 UTC 22:30，覆盖美国收盘后
    - cron: "30 22 * * *"
  workflow_dispatch: {}   # 允许在 GitHub 网页手动触发

permissions:
  contents: write        # 自动用 GITHUB_TOKEN 提交 history.json，无需任何密钥

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 配置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 运行采集脚本
        working-directory: crude-oil-tracker
        run: python collect.py

      - name: 提交并推送（仅当有变化）
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add crude-oil-tracker/history.json
          if git diff --cached --quiet; then
            echo "今日已归档，无变化，跳过提交"
          else
            git commit -m "每日原油收盘价更新 $(date -u +%Y-%m-%d)"
            git push
          fi
